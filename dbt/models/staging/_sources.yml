version: 2

sources:
  - name: raw
    description: Landed vendor exports and reference data. Written only by the nightly load; never edited by hand.
    tables:
      - name: azure_openai_usage
        description: Azure OpenAI usage export, one row per day, API key and deployment.
      - name: m365_copilot_usage
        description: Microsoft 365 Copilot usage report, one row per day, user and app.
      - name: m365_copilot_seats
        description: Microsoft 365 Copilot licence assignments, $30 a seat a month.
      - name: github_copilot_usage
        description: GitHub Copilot usage, one row per day and GitHub login, pulled from the Kestrel Copilot API.
      - name: github_copilot_seats
        description: GitHub Copilot Business seat assignments, pulled fresh from the API on every load; $19 a seat a month. One snapshot per load day under `as_of`.
      - name: api_keys
        description: Which department owns each Azure OpenAI API key.
      - name: hr_employees
        description: HR roster. `email` and `name` are personal data and must never appear in chat or email.
      - name: ai_budgets
        description: Monthly AI budget per department.
