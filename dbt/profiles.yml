# Credentials come from GOOGLE_APPLICATION_CREDENTIALS, set by the workflow.
# Every query is capped at 1 GB scanned so a mistake can't run up a bill.
ai_spend:
  target: "{{ env_var('DBT_TARGET', 'ci') }}"
  outputs:
    prod:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT') }}"
      dataset: staging
      location: US
      threads: 4
      maximum_bytes_billed: 1000000000
    ci:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT') }}"
      dataset: ci
      location: US
      threads: 4
      maximum_bytes_billed: 1000000000
